<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f3c" />
      <stop offset="1" stop-color="#04101f" />
    </linearGradient>
    <linearGradient id="og-ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c4bc" />
      <stop offset="100%" stop-color="#0a2d3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Battery icon -->
  <rect x="82" y="96" width="22" height="12" rx="4" fill="url(#og-ic)" />
  <rect x="40" y="108" width="106" height="112" rx="16" stroke="url(#og-ic)" stroke-width="5" fill="none" />
  <rect x="58" y="128" width="70" height="12" rx="3" fill="url(#og-ic)" />
  <rect x="58" y="148" width="54" height="12" rx="3" fill="url(#og-ic)" />
  <rect x="58" y="168" width="38" height="12" rx="3" fill="url(#og-ic)" />
  <rect x="58" y="188" width="22" height="9" rx="3" fill="url(#og-ic)" />

  <line x1="162" y1="118" x2="162" y2="210" stroke="#00b4a8" stroke-width="2.5" stroke-linecap="round" />

  <text x="180" y="180" font-family="Space Grotesk, sans-serif" font-size="64" fill="#ffffff" letter-spacing="-1">
    <tspan font-weight="700">EB</tspan><tspan font-weight="400">energy</tspan>
  </text>
  <text x="182" y="210" font-family="Inter, sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#00b4a8">ENGINEERING THE FUTURE OF SUSTAINABLE ENERGY STORAGE</text>

  <rect x="82" y="270" width="120" height="4" rx="2" fill="#00b4a8" />
  <text x="82" y="340" font-family="Inter, sans-serif" font-size="30" fill="#c2cad9">Commercial battery storage,</text>
  <text x="82" y="380" font-family="Inter, sans-serif" font-size="30" fill="#c2cad9">grid resilience &amp; hybrid power systems</text>
